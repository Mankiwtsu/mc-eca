[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mceca"
version = "0.5.0"
description = "Control embodied conversational agents (NPCs) in Minecraft from Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# pip install -e "python[voice]"  (push-to-talk and spoken answers)
voice = ["numpy", "sounddevice", "faster-whisper", "piper-tts"]

[tool.setuptools]
packages = ["mceca"]
