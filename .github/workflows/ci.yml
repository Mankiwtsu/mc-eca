# Checks every push and pull request:
#  - the Minecraft mod builds (Java 25),
#  - the Python library's tests pass on Linux, macOS and Windows.
name: CI

on:
  push:
  pull_request:

jobs:
  mod:
    name: Build mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        working-directory: mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: mc-eca-jar
          path: mod/build/libs/*.jar

  python:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # numpy lets the audio-queue tests run; the speech models aren't needed for the tests
        run: pip install -e python numpy
      - name: Test
        run: python -m unittest discover -s python/tests -v
